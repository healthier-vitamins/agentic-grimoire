<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Chapter stories: chapters stack vertically, a chapter's steps slide horizontally, and the
   segmented bar at the top is the only navigation. "step through this" opens the recording in a
   time-travel debugger, in a dialog over the story. */
:root {
  --bg: #f3f6f5; --card: #ffffff; --fg: #17201f; --muted: #56625f; --line: #d7dfdd;
  --accent: #0e6f68; --accent-soft: #e1f0ee; --code-bg: #eef2f1; --mark: #fbe7a6; --mark-strong: #e0b53a;
  --ok: #1f7a3a; --ok-bg: #e3f3e7; --bad: #a3262a; --bad-bg: #fbe4e4;
  --t-key: #7a3e9d; --t-str: #8a5a00; --t-num: #0e6f68; --t-com: #7d8b88; --t-fn: #1d4f91; --t-cls: #9b4d00;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1514; --card: #172020; --fg: #e4ecea; --muted: #9aa9a5; --line: #2b3735;
  --accent: #5cc4b9; --accent-soft: #1d3331; --code-bg: #1f2a29; --mark: #3b3418; --mark-strong: #8a7224;
  --ok: #7fd897; --ok-bg: #173323; --bad: #f29a9c; --bad-bg: #3a1c1d;
  --t-key: #d1a3f0; --t-str: #f0c46a; --t-num: #5cc4b9; --t-com: #7f8f8b; --t-fn: #8fb8f5; --t-cls: #f0b170;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1514; --card: #172020; --fg: #e4ecea; --muted: #9aa9a5; --line: #2b3735;
  --accent: #5cc4b9; --accent-soft: #1d3331; --code-bg: #1f2a29; --mark: #3b3418; --mark-strong: #8a7224;
  --ok: #7fd897; --ok-bg: #173323; --bad: #f29a9c; --bad-bg: #3a1c1d;
  --t-key: #d1a3f0; --t-str: #f0c46a; --t-num: #5cc4b9; --t-com: #7f8f8b; --t-fn: #8fb8f5; --t-cls: #f0b170;
  color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.5; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.feed { height: 100%; overflow-y: auto; overflow-x: hidden; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; outline: none; }
.feed::-webkit-scrollbar, .track::-webkit-scrollbar { display: none; }
.chapter { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; }
.track { height: 100%; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
.slide { flex: 0 0 100%; min-width: 0; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 68px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px)); }
.inner { width: 100%; max-width: 760px; max-height: 100%; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.inner > * { flex: none; min-width: 0; }
.slide.edge .inner { max-width: 600px; }
.inner > .flow { flex: 0 1 auto; min-height: 3.5em; overflow-y: auto; }

h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 2.2rem; }
h2 { font-size: 1.6rem; }
p { margin: 0; }
code { font-family: var(--f-mono); font-size: 0.85em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.tag { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.gist { font-size: 1.12rem; font-weight: 600; text-wrap: pretty; }
.big { font-size: 1.12rem; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.real { border-left: 3px solid var(--accent); padding-left: 14px; }
.inner > .real { flex: 0 1 auto; min-height: 3em; overflow-y: auto; }
.real b { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 500; margin-right: 6px; }
.pill { align-self: flex-start; font-family: var(--f-mono); font-size: 0.78rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 11px; border-radius: 99px; overflow-wrap: anywhere; }
.ok { color: var(--ok); background: var(--ok-bg); }
.bad { color: var(--bad); background: var(--bad-bg); }
.staged { color: var(--fg); background: var(--mark); }

/* Code: shrinks and scrolls inside the card so the values never leave the screen. */
.inner > .code { flex: 0 1 auto; min-height: 96px; }
.code { display: flex; flex-direction: column; background: var(--code-bg); border-radius: 10px; overflow: hidden; }
.code-head { flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; padding: 6px 8px 6px 14px; font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); border-bottom: 1px solid var(--line); }
.code-head > span { overflow-wrap: anywhere; min-width: 0; }
.tools { display: flex; gap: 2px; margin-left: auto; }
.quiet { font: inherit; color: var(--accent); background: none; border: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.quiet:hover, .quiet[aria-pressed="true"] { background: var(--accent-soft); }
.quiet:disabled { color: var(--muted); cursor: default; background: none; }
.code-body { overflow: auto; min-height: 0; padding: 8px 0; font-family: var(--f-mono); font-size: 0.8rem; line-height: 1.55; }
.ln { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); }
.ln .lnum { color: var(--muted); opacity: .7; text-align: right; padding-right: 14px; user-select: none; font-variant-numeric: tabular-nums; }
.ln .t { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 16px; }
.ln.ran { background: color-mix(in srgb, var(--mark) 45%, transparent); }
.ln.hit { background: var(--mark); box-shadow: inset 3px 0 0 var(--mark-strong); }
.ln.hit .lnum { opacity: 1; color: var(--fg); }
.context[hidden], .code-body[hidden] { display: none; }
.context { overflow: auto; min-height: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 0.92rem; }
.context .tag { margin-right: 6px; }
/* Pygments' short classes. */
.k, .kn, .kc, .kd, .kr, .kt, .ow { color: var(--t-key); }
.s, .s1, .s2, .sa, .se, .si, .sb, .sr, .sx, .sd { color: var(--t-str); }
.c, .c1, .cm, .ch, .cs, .cp { color: var(--t-com); font-style: italic; }
.nf, .fm { color: var(--t-fn); }
.nc, .nb, .bp, .nd { color: var(--t-cls); }
.mi, .mf, .mh, .mo, .mb { color: var(--t-num); }

/* Values: two columns, one line each; tap a long one to open it in place. */
.inner > .rows { flex: 0 1 auto; min-height: 5.5em; }
.rows { overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 2px 14px; display: flex; flex-direction: column; }
.rows .row { flex: none; display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 16px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }
.rows .row:last-child { border-bottom: 0; }
.rows .name { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); white-space: nowrap; max-width: 14em; overflow: hidden; text-overflow: ellipsis; }
.rows .val { font-family: var(--f-mono); font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; text-align: left; padding: 0; border: 0; background: none; }
.rows button.val { cursor: pointer; }
.rows button.val:hover { color: var(--accent); }
.rows .row.open { grid-template-columns: minmax(0, 1fr); gap: 2px; }
.rows .row.open .name { max-width: none; }
.rows .row.open .val { white-space: pre-wrap; overflow-wrap: anywhere; text-overflow: clip; }
.rows .ask { justify-self: start; font-family: var(--f-body); font-size: 0.78rem; }
.rows .note { padding: 8px 0; color: var(--muted); font-size: 0.9rem; }
.ask-text { width: 100%; font: 12px var(--f-mono); margin-top: 4px; }

.list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.entry { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); overflow-wrap: anywhere; }
.switch { align-self: flex-start; max-width: 100%; font-family: var(--f-mono); font-size: 0.85rem; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
.switch:hover { background: var(--accent-soft); }
.hint { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }
.flow h3 { margin: 0 0 4px; font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.flow { display: grid; gap: 10px; }

/* The one navigation element: thin segments for the current chapter's steps, with its name beside them. */
.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; background: var(--bg);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.segs { display: flex; gap: 4px; }
.segs button { flex: 1; height: 16px; padding: 6px 0; border: 0; background: none; cursor: pointer; }
.segs button i { display: block; height: 4px; border-radius: 2px; background: var(--line); transition: background .2s; }
.segs button.done i { background: var(--accent); }
.segs button:hover i { background: var(--muted); }
.segs button.done:hover i { background: var(--accent); }
.where-am-i { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
.where-am-i b { font-weight: 500; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.where-am-i span { white-space: nowrap; font-variant-numeric: tabular-nums; }

/* The debugger: one dialog over the story, closed by Esc or its Close button. */
.dbg { width: min(1180px, calc(100vw - 24px)); height: calc(100dvh - 24px); max-height: none; max-width: none; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); }
.dbg::backdrop { background: rgb(0 0 0 / .35); }
.dbg[open] { display: flex; flex-direction: column; }
.dbg-head { flex: none; display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px 8px; }
.dbg-head .at { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dbg-head .fn { font-family: var(--f-mono); font-weight: 500; overflow-wrap: anywhere; }
.dbg-head .sub { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); overflow-wrap: anywhere; }
.dbg-head .story { font-size: 0.85rem; color: var(--accent); }
.dbg-bar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; border-bottom: 1px solid var(--line); }
.dbg-bar button, .close { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
.dbg-bar button:disabled { opacity: .4; cursor: default; }
.dbg-panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px 16px; }
.dbg-panes > * { min-height: 0; min-width: 0; overflow: auto; }
.dbg-panes .code-body { overflow: visible; }
.side { display: flex; flex-direction: column; gap: 12px; }
.side h3 { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.vars { display: flex; flex-direction: column; gap: 6px; font-family: var(--f-mono); font-size: 0.8rem; }
.vars .one, .vars details { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.vars summary { cursor: pointer; }
.vars details[open] > summary .label { display: none; }
.vars .vname { color: var(--t-fn); font-weight: 500; }
.vars .changed { background: var(--mark); }
.vars .value { margin-top: 4px; }
.vars .group > .vars { margin-top: 6px; }
.stack { list-style: none; margin: 0; padding: 0; font-family: var(--f-mono); font-size: 0.78rem; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.stack li:first-child { font-weight: 500; }

@media (max-width: 760px) {
  .dbg-panes { display: flex; flex-direction: column; overflow-y: auto; }
  .dbg-panes > * { flex: none; overflow: visible; }
}
@media (max-width: 600px) {
  h1 { font-size: 1.75rem; } h2 { font-size: 1.3rem; }
  .slide { padding-bottom: 14px; }
  .inner { gap: 11px; }
  .gist, .big { font-size: 1.02rem; }
  .real { font-size: 0.92rem; }
  .rows .name { max-width: 8.5em; }
  .code-body { font-size: 0.74rem; }
}
@media (prefers-reduced-motion: reduce) { .segs button i { transition: none; } }
</style>
</head>
<body>
<header class="bar"><nav class="bar-in" aria-label="Steps in this chapter">
  <div class="segs" id="segs"></div>
  <div class="where-am-i"><b id="chapter-title"></b><span id="chapter-count" aria-live="polite"></span></div>
</nav></header>
<main class="feed" id="feed" tabindex="-1" aria-label="Recorded run"></main>
<dialog class="dbg" id="dbg" aria-label="Step through the recording"></dialog>

<script type="application/json" id="data">/*__DATA__*/null</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const WORKFLOWS = DATA.workflows;
  const el = (tag, attrs, ...kids) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") node.className = v;
      else if (k === "html") node.innerHTML = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined) node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return node;
  };
  // `text` in walkthrough prose is a name from the code.
  const prose = (text) => text.split("`").map((part, i) => i % 2 ? el("code", {}, part) : part);
  const textOf = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent; };
  const shortName = (fn) => fn.split(".").slice(1).join(".") || fn;

  // ---- code lines, highlighted by the build ----------------------------------------------------
  // `marks.hit` and `marks.ran` are Sets of line numbers to mark and to tint.
  function codeLines(path, from, to, marks) {
    const lines = DATA.sources[path] || [];
    const body = el("div", { class: "code-body" });
    for (let n = Math.max(1, from); n <= to && n <= lines.length; n++) {
      const html = lines[n - 1] || " ";
      // A wrapped line continues 4 columns past its own indent, so the block structure stays visible.
      const hang = textOf(html).match(/^ */)[0].length + 4;
      const cls = "ln" + (marks.hit && marks.hit.has(n) ? " hit" : "") + (marks.ran && marks.ran.has(n) ? " ran" : "");
      body.append(el("div", { class: cls, "data-n": n }, el("span", { class: "lnum" }, n), el("span", { class: "t", style: `padding-left:${hang}ch;text-indent:-${hang}ch`, html })));
    }
    return body;
  }

  // ---- values -----------------------------------------------------------------------------------
  // Copies a question naming exactly where this value lives, to paste into a Claude Code session in
  // the project: texts.json holds every value in full, so the answer is read, not re-run. Where
  // the clipboard is blocked, the question shows selected instead.
  function askButton(name, text, place) {
    const question = [
      `Codewalk page, ${place}.`,
      `Variable \`${name}\` is texts[${DATA.texts.indexOf(text)}] in ${DATA.texts_path} (the full value; the page may show only its start).`,
      "Question: ",
    ].join("\n");
    const button = el("button", { type: "button", class: "quiet ask", title: "Copy a question about this value, to paste into Claude Code", onclick: async (event) => {
      event.preventDefault(); event.stopPropagation();
      try {
        await navigator.clipboard.writeText(question);
        button.textContent = "copied";
      } catch {
        const box = el("textarea", { class: "ask-text", readonly: "", rows: 4 }, question);
        button.replaceWith(box);
        box.select();
        return;
      }
      setTimeout(() => { button.textContent = "ask"; }, 1500);
    } }, "ask");
    return button;
  }

  const isLong = (text) => text.includes("\n") || text.length > 44;
  // A multi-line value shows folded onto one line; tapping opens it whole, in place.
  const folded = (text) => text.replace(/\n\s*/g, " ").replace(/\(\s/g, "(").replace(/,\s\)/g, ")").replace(/\[\s/g, "[");

  function valueRow(name, text, place, title) {
    if (!isLong(text)) return el("div", { class: "row" }, el("span", { class: "name" }, name), el("span", { class: "val", title }, text));
    const ask = askButton(name, text, place); ask.hidden = true;
    const row = el("div", { class: "row" }, el("span", { class: "name" }, name));
    const value = el("button", { type: "button", class: "val", "aria-expanded": "false", title: title || "Show the full value", onclick: () => {
      const open = value.getAttribute("aria-expanded") !== "true";
      value.setAttribute("aria-expanded", String(open));
      value.textContent = open ? text : folded(text);
      row.classList.toggle("open", open);
      ask.hidden = !open;
    } }, folded(text));
    row.append(value, ask);
    return row;
  }

  // ---- the story --------------------------------------------------------------------------------
  const feed = document.getElementById("feed");
  const segs = document.getElementById("segs");
  let wi = 0;           // the workflow shown
  let screens = [];     // [{title, kind: 'start' | 'chapter' | 'end', track, slides}]
  let at = { chapter: 0, step: 0 };

  const label = (c, s) => `${c + 1}.${s + 1}`;

  // Every value the walkthrough marked as what came in or went out, with the step it is from.
  function flow(w, field) {
    const rows = [];
    w.chapters.forEach((chapter, c) => chapter.steps.forEach((step, s) => {
      for (const name of step[field]) {
        const pair = step.values.find(([n]) => DATA.texts[n] === name);
        if (pair) rows.push(valueRow(name, DATA.texts[pair[1]], `workflow \`${w.key}\` ("${w.title}"), walkthrough step ${label(c, s)} "${step.title}"`, `from step ${label(c, s)}: ${step.title}`));
      }
    }));
    return rows;
  }

  function otherWorkflows() {
    return WORKFLOWS.map((w, index) => index === wi ? null :
      el("button", { type: "button", class: "switch", onclick: () => render(index) }, `Workflow ${index + 1}: ${w.title} →`));
  }

  function startScreen(w) {
    const run = debugRun(w);
    const stepCount = w.chapters.reduce((n, c) => n + c.steps.length, 0);
    const cameIn = flow(w, "came_in");
    return el("section", { class: "slide edge" }, el("div", { class: "inner" },
      el("span", { class: "tag" }, `Workflow ${wi + 1} of ${WORKFLOWS.length} · one recorded ${w.entry.kind} run`),
      el("h1", {}, w.title),
      w.summary ? el("p", { class: "big" }, prose(w.summary)) : null,
      el("span", { class: "pill " + (w.exit.ok ? "ok" : "bad") }, (w.exit.ok ? "Passed" : "Failed") + " · " + w.exit.detail),
      el("p", { class: "entry" }, w.entry.target),
      cameIn.length ? el("div", { class: "flow" }, el("div", {}, el("h3", {}, "The input that started it"), el("div", { class: "rows" }, cameIn))) : null,
      w.fakes.length ? el("div", { class: "real small muted" }, el("b", {}, "Faked"), w.fakes.flatMap(f => [...prose(f), " "])) : el("p", { class: "small muted" }, "Nothing was faked: every call ran for real."),
      w.staged.length ? el("span", { class: "pill staged" }, `${w.staged.length} staged file(s), not applied`) : null,
      w.truncated ? el("span", { class: "pill bad" }, "The recording stopped at --max-steps") : null,
      el("p", { class: "hint" }, `${stepCount} steps in ${w.chapters.length} chapters, chosen from ${run.steps.length} recorded steps and ${run.frames.length} calls.`,
        w.recorder_ms >= 100 ? ` The recorder added ${(w.recorder_ms / 1000).toFixed(1)} s to the run's own timings.` : "",
        " Right or space for the next step, down for the next chapter."),
      otherWorkflows()));
  }

  function stepScreen(w, c, s) {
    const step = w.chapters[c].steps[s];
    const place = `workflow \`${w.key}\` ("${w.title}"), walkthrough step ${label(c, s)} "${step.title}"`;
    const context = el("div", { class: "context", hidden: "" },
      el("p", {}, el("span", { class: "tag" }, "Where"), prose(step.where)),
      el("p", {}, el("span", { class: "tag" }, "What"), prose(step.what)),
      step.why ? el("p", {}, el("span", { class: "tag" }, "Why"), prose(step.why)) : null);
    const lines = codeLines(step.path, step.from, step.to, {});
    const toggle = el("button", { type: "button", class: "quiet ctx", "aria-pressed": "false", onclick: () => {
      const show = toggle.getAttribute("aria-pressed") !== "true";
      toggle.setAttribute("aria-pressed", String(show));
      toggle.textContent = show ? "code" : "where · why";
      lines.hidden = show; context.hidden = !show;
    } }, "where · why");
    const walk = step.anchor === null
      ? el("button", { type: "button", class: "quiet", disabled: "", title: "These lines did not run in this recording" }, "did not run")
      : el("button", { type: "button", class: "quiet walk", title: "Open the recording at this step and step through it", onclick: () => openDebugger(w, step.anchor) }, "step through this");
    const values = step.values.map(([n, v]) => valueRow(DATA.texts[n], DATA.texts[v], place));
    return el("section", { class: "slide", "data-step": label(c, s) }, el("div", { class: "inner" },
      el("h2", {}, step.title),
      el("p", { class: "gist" }, prose(step.gist)),
      el("div", { class: "code" },
        el("div", { class: "code-head" },
          el("span", {}, `${step.path}:${step.from}–${step.to}`, w.staged.includes(step.path) ? " · staged, not applied" : ""),
          el("span", { class: "tools" }, toggle, walk)),
        lines, context),
      el("div", { class: "rows", "aria-label": "Values in this run" }, values.length ? values
        : el("p", { class: "note" }, step.anchor === null ? "These lines did not run in this recording." : "No variables here yet.")),
      el("p", { class: "real" }, el("b", {}, "In this run"), prose(step.run))));
  }

  function endScreen(w) {
    const cameIn = flow(w, "came_in"), wentOut = flow(w, "went_out");
    return el("section", { class: "slide edge" }, el("div", { class: "inner" },
      el("span", { class: "tag" }, w.exit.ok ? `The ${w.entry.kind} passed` : `The ${w.entry.kind} failed`),
      el("h2", {}, w.title),
      cameIn.length || wentOut.length ? el("div", { class: "flow" },
        cameIn.length ? el("div", {}, el("h3", {}, "Came in"), el("div", { class: "rows" }, cameIn)) : null,
        wentOut.length ? el("div", {}, el("h3", {}, "Went out"), el("div", { class: "rows" }, wentOut)) : null) : null,
      el("p", { class: "muted small" }, w.exit.detail),
      otherWorkflows(),
      el("p", { class: "hint" }, "Press Home to go back to the start.")));
  }

  function render(index) {
    wi = index;
    const w = WORKFLOWS[wi];
    screens = [{ title: w.title, kind: "start", slides: [startScreen(w)] }];
    w.chapters.forEach((chapter, c) => screens.push({ title: chapter.title, kind: "chapter", slides: chapter.steps.map((_, s) => stepScreen(w, c, s)) }));
    screens.push({ title: "What came in and went out", kind: "end", slides: [endScreen(w)] });
    feed.replaceChildren(...screens.map(screen => {
      screen.track = el("div", { class: "track" }, screen.slides);
      return el("div", { class: "chapter" }, screen.track);
    }));
    document.title = w.title + " · Codewalk";
    feed.scrollTop = 0;
    at = { chapter: 0, step: 0 };
    drawBar();
    feed.focus();
  }

  function drawBar() {
    const screen = screens[at.chapter];
    segs.replaceChildren(...screen.slides.map((_, i) => el("button", { type: "button", class: i <= at.step ? "done" : null, "data-step": i,
      "aria-label": `Step ${i + 1} of ${screen.slides.length}`, "aria-current": i === at.step ? "step" : null }, el("i"))));
    document.getElementById("chapter-title").textContent = screen.title;
    document.getElementById("chapter-count").textContent = screen.kind === "start" ? "start" : screen.kind === "end" ? "end" :
      `chapter ${at.chapter} of ${screens.length - 2} · step ${at.step + 1} of ${screen.slides.length}`;
  }

  // Position is read back from the scroll offsets, so swipes, keys and taps all end up here.
  function readPosition() {
    const chapter = Math.max(0, Math.min(screens.length - 1, Math.round(feed.scrollTop / feed.clientHeight)));
    const track = screens[chapter].track;
    const step = Math.round(track.scrollLeft / track.clientWidth);
    if (chapter === at.chapter && step === at.step) return;
    at = { chapter, step };
    drawBar();
  }

  const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
  function goStep(step) { const track = screens[at.chapter].track; track.scrollTo({ left: step * track.clientWidth, behavior: smooth() }); }
  // Entering a chapter opens it on its first step, or on its last when moving back into it.
  function goChapter(chapter, step) {
    if (chapter < 0 || chapter >= screens.length) return;
    const track = screens[chapter].track;
    track.scrollTo({ left: step * track.clientWidth, behavior: "auto" });
    feed.scrollTo({ top: chapter * feed.clientHeight, behavior: smooth() });
  }
  function next() { if (at.step < screens[at.chapter].slides.length - 1) goStep(at.step + 1); else goChapter(at.chapter + 1, 0); }
  function back() { if (at.step > 0) goStep(at.step - 1); else if (at.chapter > 0) goChapter(at.chapter - 1, screens[at.chapter - 1].slides.length - 1); }

  feed.addEventListener("scroll", readPosition, true);
  segs.addEventListener("click", (event) => { const b = event.target.closest("button[data-step]"); if (b) goStep(+b.dataset.step); });

  let lastPointer = "mouse";
  feed.addEventListener("pointerdown", (event) => { lastPointer = event.pointerType; });
  // Story taps, touch only: right third goes on, left third goes back. Code, values, buttons and
  // selected text are for reading, so a tap there never moves.
  feed.addEventListener("click", (event) => {
    if (lastPointer !== "touch" && lastPointer !== "pen") return;
    if (event.target.closest(".code, .rows, button, a, code, textarea") || String(getSelection())) return;
    const slide = event.target.closest(".slide");
    if (!slide) return;
    const box = slide.getBoundingClientRect();
    const x = (event.clientX - box.left) / box.width;
    if (x > 2 / 3) next(); else if (x < 1 / 3) back();
  });

  document.addEventListener("keydown", (event) => {
    if (dialog.open) return;
    if (event.target.closest && event.target.closest("button, textarea") && (event.key === " " || event.key === "Enter")) return;
    const actions = {
      ArrowRight: () => { if (at.step < screens[at.chapter].slides.length - 1) goStep(at.step + 1); },
      ArrowLeft: () => { if (at.step > 0) goStep(at.step - 1); },
      ArrowDown: () => goChapter(at.chapter + 1, 0), ArrowUp: () => goChapter(at.chapter - 1, 0),
      PageDown: () => goChapter(at.chapter + 1, 0), PageUp: () => goChapter(at.chapter - 1, 0),
      " ": event.shiftKey ? back : next, j: next, k: back,
      Home: () => goChapter(0, 0), End: () => goChapter(screens.length - 1, 0),
    };
    if (!actions[event.key]) return;
    event.preventDefault();
    actions[event.key]();
  });

  // ---- the debugger: every step of the recorded run, stepped like VS Code ----------------------
  // The recorder kept one step per line, call, await, resume and return, packed as ints by the
  // build. `debugRun` unpacks a workflow once; the step commands only search that array.
  const ENDS = new Set(["return", "unwind"]);
  const STEP_WORDS = { call: "called", line: "about to run this line", await: "suspended at an await", yield: "yielded a value", resume: "resumed", return: "returning", raise: "raised", unwind: "left by an exception" };
  const runs = new Map();

  function debugRun(w) {
    if (runs.has(w.key)) return runs.get(w.key);
    const steps = [];
    const packed = w.steps;
    for (let i = 0; i < packed.length;) {
      const step = { frame: packed[i], line: packed[i + 1], kind: DATA.step_kinds[packed[i + 2]], changed: {} };
      const count = packed[i + 3];
      i += 4;
      for (let k = 0; k < count; k++, i += 2) step.changed[DATA.texts[packed[i]]] = packed[i + 1] === -1 ? null : DATA.texts[packed[i + 1]];
      steps.push(step);
    }
    const stops = new Map(); // a walkthrough step's stop -> its label and title
    w.chapters.forEach((chapter, c) => chapter.steps.forEach((s, k) => { if (s.anchor !== null && !stops.has(s.anchor)) stops.set(s.anchor, `${label(c, k)} ${s.title}`); }));
    const run = { steps, frames: w.frames, stops, breakpoints: new Set(w.breakpoints), ancestors: new Map() };
    runs.set(w.key, run);
    return run;
  }

  function ancestorsOf(run, frame) {
    if (!run.ancestors.has(frame)) {
      const up = new Set();
      for (let f = run.frames[frame].parent; f !== -1; f = run.frames[f].parent) up.add(f);
      run.ancestors.set(frame, up);
    }
    return run.ancestors.get(frame);
  }

  const isStop = (run, j) => run.stops.has(j) || (run.steps[j].kind === "call" && run.breakpoints.has(run.frames[run.steps[j].frame].function));

  // The step commands as VS Code defines them; each gives a step index, or null at either end.
  // Over and out follow the call stack, so while this frame awaits, other tasks' steps are passed.
  function stepCommands(run, i) {
    const here = run.steps[i];
    const up = ancestorsOf(run, here.frame);
    const ended = ENDS.has(here.kind);
    const next = (test) => { for (let j = i + 1; j < run.steps.length; j++) if (test(run.steps[j], j)) return j; return null; };
    const prev = (test) => { for (let j = i - 1; j >= 0; j--) if (test(run.steps[j], j)) return j; return null; };
    const into = i + 1 < run.steps.length ? i + 1 : null;
    const inCaller = (s) => up.has(s.frame);
    return {
      back: i > 0 ? i - 1 : null,
      into,
      over: (ended ? next(inCaller) : next(s => s.frame === here.frame || inCaller(s))) ?? (ended ? into : null),
      out: (ended ? next(inCaller) : next(s => (s.frame === here.frame && ENDS.has(s.kind)) || inCaller(s))) ?? (ended ? into : null),
      prevStop: prev((s, j) => isStop(run, j)),
      nextStop: next((s, j) => isStop(run, j)),
    };
  }

  // The current frame as of step i: its variables (in the order they appeared), the lines it has
  // run since it was called, the line it is on, and the names the last line changed.
  function frameAt(run, i) {
    const frame = run.steps[i].frame;
    let called = i;
    while (called > 0 && !(run.steps[called].frame === frame && run.steps[called].kind === "call")) called--;
    const vars = {}; const ran = new Set(); let line = null;
    for (let j = called; j <= i; j++) {
      const s = run.steps[j];
      if (s.frame !== frame) continue;
      line = s.line;
      if (s.kind === "line") ran.add(s.line);
      for (const [name, text] of Object.entries(s.changed)) {
        if (text === null) delete vars[name]; // the variable left the frame
        else if (!name.startsWith("(")) vars[name] = text;
      }
    }
    const here = run.steps[i];
    for (const [name, text] of Object.entries(here.changed)) if (name.startsWith("(") && text !== null) vars[name] = text;
    const changed = here.kind === "call" ? new Set() : new Set(Object.keys(here.changed));
    return { vars, ran, line, changed };
  }

  // Long or multi-line values fold, with their opening as the label.
  function variable(name, text, changed, place) {
    const long = text.includes("\n") || text.length > 120;
    if (!long) return el("div", { class: "one" + (changed ? " changed" : "") }, el("span", { class: "vname" }, name), ` = ${text}`);
    return el("details", { class: changed ? "changed" : null },
      el("summary", {}, el("span", { class: "vname" }, name), " = ", el("span", { class: "label" }, folded(text).slice(0, 80) + " …"), " ", askButton(name, text, place)),
      el("div", { class: "value" }, text));
  }

  const dialog = document.getElementById("dbg");
  let debugging = null; // { w, run, step }

  function openDebugger(w, step) {
    debugging = { w, run: debugRun(w), step };
    drawDebugger();
    dialog.showModal();
  }
  dialog.addEventListener("close", () => { debugging = null; dialog.replaceChildren(); });

  function drawDebugger() {
    const { w, run, step } = debugging;
    const here = run.steps[step];
    const frame = run.frames[here.frame];
    const commands = stepCommands(run, step);
    const go = (n) => { if (n !== null) { debugging.step = n; drawDebugger(); } };
    const button = (text, command, title) => el("button", { type: "button", "data-command": command, title, disabled: commands[command] === null ? "" : null, onclick: () => go(commands[command]) }, text);
    const state = frameAt(run, step);
    const place = `workflow \`${w.key}\` ("${w.title}"), debugger step ${step + 1} of ${run.steps.length}, frame \`${frame.function}\` at ${frame.path}:${state.line}`;
    const names = Object.keys(state.vars);
    const member = (name) => /^(self|this)\./.test(name);
    const own = names.filter(name => !member(name)), members = names.filter(member);
    const code = codeLines(frame.path, frame.start, frame.end, { hit: new Set([here.line]), ran: state.ran });
    const stack = [];
    for (let f = here.frame; f !== -1; f = run.frames[f].parent) stack.push(run.frames[f]);
    const atEnd = step === run.steps.length - 1;
    dialog.replaceChildren(
      el("header", { class: "dbg-head" },
        el("div", { class: "at", "data-step": step, "data-line": here.line },
          el("span", { class: "fn" }, `${shortName(frame.function)}()`),
          el("span", { class: "sub" }, `${frame.path}:${here.line} · ${STEP_WORDS[here.kind]} · step ${step + 1} of ${run.steps.length}${frame.task === "main" ? "" : " · " + frame.task}`),
          run.stops.has(step) ? el("span", { class: "story" }, `Story step ${run.stops.get(step)}`) : null,
          atEnd ? el("span", { class: "story" }, `End of the recording. The run ${w.exit.ok ? "passed" : "failed"}: ${w.exit.detail}`) : null),
        el("button", { type: "button", class: "close", onclick: () => dialog.close() }, "Close")),
      el("div", { class: "dbg-bar" },
        button("◀◀ Stop", "prevStop", "Back to the previous stop (Shift+F5, C)"),
        button("← Back", "back", "One step back (←, b)"),
        button("Over ⤼", "over", "Step over (F10, o): the next line here, skipping the calls it makes"),
        button("Into ↓", "into", "Step into (F11, i, →): the very next step, wherever it is"),
        button("Out ↑", "out", "Step out (Shift+F11, u): to this function's return, then its caller"),
        button("Stop ▶▶", "nextStop", "On to the next stop: a story step or a breakpoint (F5, c)")),
      el("div", { class: "dbg-panes" },
        el("div", { class: "code" }, code),
        el("div", { class: "side" },
          el("section", {}, el("h3", {}, `Variables in ${shortName(frame.function)}()`),
            el("div", { class: "vars" }, names.length ? [
              ...own.map(name => variable(name, state.vars[name], state.changed.has(name), place)),
              members.length ? el("details", { class: "group" + (members.some(n => state.changed.has(n)) ? " changed" : "") },
                el("summary", {}, el("span", { class: "vname" }, members[0].split(".")[0]), ` (${members.length} attributes)`),
                el("div", { class: "vars" }, members.map(name => variable(name, state.vars[name], state.changed.has(name), place)))) : null,
            ] : el("p", { class: "small muted" }, "No variables yet."))),
          el("section", {}, el("h3", {}, "Call stack"),
            el("ol", { class: "stack" }, stack.map(f => el("li", {}, `${shortName(f.function)}() · ${f.path}:${f.start}`))),
            el("p", { class: "small muted" }, "Innermost first. Above the last one: the entry, which is not stepped into.")))));
    const hit = code.querySelector(".ln.hit");
    if (hit) requestAnimationFrame(() => { code.parentElement.scrollTop = hit.offsetTop - code.parentElement.clientHeight / 2; });
  }

  dialog.addEventListener("keydown", (event) => {
    if (!debugging || event.target.closest("textarea")) return;
    const key = { F10: "over", F11: event.shiftKey ? "out" : "into", F5: event.shiftKey ? "prevStop" : "nextStop", o: "over", i: "into", u: "out", c: "nextStop", C: "prevStop", b: "back", ArrowRight: "into", ArrowLeft: "back" }[event.key];
    if (!key) return;
    event.preventDefault();
    const target = stepCommands(debugging.run, debugging.step)[key];
    if (target !== null) { debugging.step = target; drawDebugger(); }
  });

  render(0);
})();
</script>
</body>
</html>
